name: Deploy na server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat deploy webhook
        # Server za Cloudflare občas odpoví 522 (timeout spojení s originem),
        # typicky jen při prvním pokusu — webhook je idempotentní, tak to zkusit znovu.
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" -H "X-Deploy-Sha: ${{ github.sha }}" "https://skautchlumec.cz/wp-content/plugins/skautska-burza/deploy-webhook.php"
