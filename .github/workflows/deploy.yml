name: Deploy na server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat deploy webhook
        run: |
          curl -fsS -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" -H "X-Deploy-Sha: ${{ github.sha }}" "https://skautchlumec.cz/wp-content/plugins/skautska-burza/deploy-webhook.php"
